<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Music Tracker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">

    {% block extra_css %}{% endblock %}
</head>
<body>

    <!-- Shared Header -->
    <header class="app-header">
        <div class="header-content">
            <div class="header-left">
                <h1 class="app-title">Music Tracker</h1>
            </div>

            <div class="header-centre">
                <div id="now-playing-banner" class="now-playing hidden">
                    Not playing
                </div>
            </div>
            
            <div class="header-right">
                <nav>
                    <a href="/" class="nav-link">Home</a>
                    <a href="/songlist_page" class="nav-link">Song List</a>
                    <a href="/sheetscup_page" class="nav-link">Sheets Cup</a>
                </nav>
            </div>
        </div>
    </header>

    <!-- Page Content -->
    <main>
        {% block content %}{% endblock %}
    </main>

    <script src="{{ url_for('static', filename='js/base.js') }}"></script>
{% block scripts %}{% endblock %}

</body>
</html>
