{% extends "base.html" %}

{% block extra_css %}
<link rel="stylesheet" href = "{{ url_for('static', filename='css/big16.css') }}">
{% endblock %}

{% block content %}
<div class="big16-page">
    <h2>Big 16</h2>
    <div id="big16-table-wrapper">
        <div id="big16-table"></div>
    </div>
    <h2>Month Creator</h2>
    <div class="big16-creator-wrapper">
        <div class="top-bar">
            <label for="yearSelect">Year</label>
            <select id="yearSelect"></select>
            <label for="monthSelect">Month</label>
            <select id="monthSelect">
                <option value="1">January</option>
                <option value="2">February</option>
                <option value="3">March</option>
                <option value="4">April</option>
                <option value="5">May</option>
                <option value="6">June</option>
                <option value="7">July</option>
                <option value="8">August</option>
                <option value="9">September</option>
                <option value="10">October</option>
                <option value="11">November</option>
                <option value="12">December</option>
            </select>
            <button id="saveBig16" onclick="saveBig16()">Save Big 16</button>
        </div>
        <div class="lists">
            <div class="panel">
                <h3>Available Songs</h3>
                <ul id="candidateSongs">
                </ul>
            </div>
            <div class="panel">
                <h3>Big 16</h3>
                <ul id="big16List">
                </ul>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
<script src="{{ url_for('static', filename='js/big16.js') }}"></script>
{% endblock %}
