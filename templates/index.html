<!DOCTYPE html>
<html>
<head>
    <title>Listening Data Discovery</title>
    <style>
        body { font-family: Arial; margin: 30px; background: #121212; color: white; }
        input, select, button { margin: 5px; padding: 5px; }
        table { border-collapse: collapse; margin-top: 20px; width: 100%; }
        th, td { border: 1px solid #444; padding: 8px; }
        th { cursor: pointer; background: #222; }
        tr:nth-child(even) { background: #1a1a1a; }
    </style>
</head>
<body>

<h2>Query Builder</h2>

<div>
    <label>Select:</label>
    <select id="selectField">
        <option value="artist">Artist</option>
        <option value="album">Album</option>
        <option value="song">Song</option>
        <option value="day">Day</option>
        <option value="month">Month</option>
        <option value="year">Year</option>
    </select>

    <label>Metric:</label>
    <select id="metric">
        <option value="plays">Plays</option>
        <option value="songs">Songs</option>
        <option value="albums">Albums</option>
    </select>

    <label>Condition:</label>
    <select id="operator">
        <option value=">">Over</option>
        <option value="<">Under</option>
        <option value="=">Equals</option>
    </select>

    <input type="number" id="value" placeholder="Enter number">

    <button onclick="runQuery()">Run</button>
</div>

<div class="controls">
    <button onclick="toggleView()">Toggle Grid/Card</button>
</div>

<div id="resultsContainer" class="card-view"></div>

<div id="name-fix-container">
    <h2>Fix Names</h2>

    <!-- Artist -->
    <div class="form-row" style="position: relative;">
        <label>Artist:</label>
        <input type="text" id="artist-input" placeholder="Search artist...">
        <div id="artist-dropdown" class="dropdown"></div>
    </div>

    <!-- Song -->
    <div class="form-row">
        <label>Song (optional):</label>
        <select id="song-select">
            <option value="">-- Select Song --</option>
        </select>
    </div>

    <!-- New Name -->
    <div class="form-row">
        <label>New Name:</label>
        <input type="text" id="new-name" placeholder="Corrected name">
    </div>

    <!-- Button -->
    <button id="apply-fix-btn">Apply Fix</button>
</div>

<!-- Popup Modal -->
<div id="popup" class="hidden">
    <div id="popup-content">
        <p id="popup-message"></p>
        <button onclick="closePopup()">OK</button>
    </div>
</div>

<link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
<script src="{{ url_for('static', filename='js/nameFix.js') }}"></script>

</body>
</html>
