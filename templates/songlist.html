{% extends "base.html" %}

{% block content %}
<div class="songlist-page">
    <h2>Song List</h2>

    <div id="dateTools">
        <input type="date" id="startDate" />
        <input type="date" id="endDate" />
        <button onclick="loadSongs()">Apply Date Filter</button>
        <button onclick="loadThisMonth()">This Month</button>
    </div>

    <div id="results"></div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/songlist.js') }}"></script>
{% endblock %}
